<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Embedded Map</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Pulsing user location marker dot */
        .user-location-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .marker-pulse {
            width: 48px;
            height: 48px;
            background: rgba(37, 99, 235, 0.25);
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            position: absolute;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .marker-core {
            width: 18px;
            height: 18px;
            background-color: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.6);
            z-index: 2;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.3);
                opacity: 0.8;
            }
            80%, 100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        /* Custom Leaflet overrides */
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.7) !important;
            color: #94a3b8 !important;
            font-size: 10px !important;
            padding: 2px 8px !important;
            border-radius: 4px;
            backdrop-filter: blur(8px);
        }
        .leaflet-control-attribution a {
            color: #38bdf8 !important;
            text-decoration: none;
        }
        .leaflet-vml-shape {
            width: 1px;
            height: 1px;
        }
        .leaflet-container {
            background: #0f172a;
        }

        /* Popup styling */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
        .popup-title {
            font-weight: 600;
            font-size: 14px;
            color: #38bdf8;
            margin-bottom: 2px;
        }
        .popup-coords {
            font-size: 12px;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map;
        var userMarker;
        var accuracyCircle;
        var currentLat = 0;
        var currentLng = 0;
        var currentAccuracy = 0;
        var currentTheme = 'standard';
        var tileLayer;

        var tileProviders = {
            'standard': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }),
            'dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }),
            'satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            })
        };

        function initMap() {
            // Default initial location: Center of Map before GPS fix
            map = L.map('map', {
                zoomControl: false,
                attributionControl: true
            }).setView([20.5937, 78.9629], 5);

            tileLayer = tileProviders['standard'].addTo(map);

            // Custom user marker icon
            var customIcon = L.divIcon({
                className: 'user-location-marker',
                html: '<div class="marker-pulse"></div><div class="marker-core"></div>',
                iconSize: [48, 48],
                iconAnchor: [24, 24]
            });

            map.on('click', function(e) {
                if (window.AndroidBridge && window.AndroidBridge.onMapClicked) {
                    window.AndroidBridge.onMapClicked(e.latlng.lat, e.latlng.lng);
                }
            });
        }

        function updateLocation(lat, lng, accuracy, followUser) {
            currentLat = lat;
            currentLng = lng;
            currentAccuracy = accuracy || 0;

            var latLng = [lat, lng];

            if (!userMarker) {
                var customIcon = L.divIcon({
                    className: 'user-location-marker',
                    html: '<div class="marker-pulse"></div><div class="marker-core"></div>',
                    iconSize: [48, 48],
                    iconAnchor: [24, 24]
                });
                userMarker = L.marker(latLng, { icon: customIcon }).addTo(map);
                userMarker.bindPopup('<div class="popup-title">Current Location</div><div class="popup-coords">' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</div>');
            } else {
                userMarker.setLatLng(latLng);
                userMarker.setPopupContent('<div class="popup-title">Current Location</div><div class="popup-coords">' + lat.toFixed(5) + ', ' + lng.toFixed(5) + '</div>');
            }

            if (accuracy > 0) {
                if (!accuracyCircle) {
                    accuracyCircle = L.circle(latLng, {
                        radius: accuracy,
                        color: '#3b82f6',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);
                } else {
                    accuracyCircle.setLatLng(latLng);
                    accuracyCircle.setRadius(accuracy);
                }
            }

            if (followUser !== false) {
                map.flyTo(latLng, 16, {
                    animate: true,
                    duration: 1.5
                });
            }
        }

        function recenterMap() {
            if (currentLat !== 0 || currentLng !== 0) {
                map.flyTo([currentLat, currentLng], 16, {
                    animate: true,
                    duration: 1.2
                });
            }
        }

        function setMapLayer(style) {
            if (tileProviders[style] && style !== currentTheme) {
                map.removeLayer(tileLayer);
                tileLayer = tileProviders[style];
                tileLayer.addTo(map);
                currentTheme = style;
            }
        }

        function zoomIn() {
            map.zoomIn();
        }

        function zoomOut() {
            map.zoomOut();
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
